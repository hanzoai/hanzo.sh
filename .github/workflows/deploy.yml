name: deploy

# Every push to main publishes the hanzo-sh Worker, then fails unless
# https://hanzo.sh serves the bytes this run built. GitHub is the plane that runs
# hanzoai/* jobs, on the platform's JIT runners; the forge copy is a mirror and
# runs nothing. The Cloudflare key comes from KMS at run time, never GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: linux-amd64
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: hanzoai/ci, ref: v2, path: .ci }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile && pnpm build

      # A byte before the doctype puts the page in quirks mode; both published
      # one-liners pipe to a shell, so dash and bash must each parse the script;
      # dist/index.html would outrank the Worker and hand curl the HTML.
      - name: Check the page and the installer
        run: |
          [ "$(head -c 15 dist/page.html)" = '<!DOCTYPE html>' ]
          [ ! -e dist/index.html ]
          [ "$(head -1 dist/install.sh)" = '#!/bin/sh' ]
          dash -n dist/install.sh
          bash -n dist/install.sh

      - name: Publish
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
        run: |
          CLOUDFLARE_EMAIL=$(.ci/bin/kms cloudflare/CF_API_EMAIL)
          CLOUDFLARE_API_KEY=$(.ci/bin/kms cloudflare/CF_API_KEY)
          echo "::add-mask::$CLOUDFLARE_EMAIL"
          echo "::add-mask::$CLOUDFLARE_API_KEY"
          CLOUDFLARE_ACCOUNT_ID=$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=hanzo.sh' \
            -H "X-Auth-Email: $CLOUDFLARE_EMAIL" -H "X-Auth-Key: $CLOUDFLARE_API_KEY" |
            jq -er '.result[0].account.id')
          export CLOUDFLARE_EMAIL CLOUDFLARE_API_KEY CLOUDFLARE_ACCOUNT_ID
          npx -y wrangler@3 deploy

      - name: Prove hanzo.sh serves this build
        run: |
          want=$(sha256sum < dist/install.sh)
          for i in $(seq 30); do
            got=$(curl -fsS https://hanzo.sh | sha256sum) && [ "$got" = "$want" ] && break
            sleep 5
          done
          [ "$got" = "$want" ] || { echo "::error::curl hanzo.sh is not the installer this run built"; exit 1; }
          css=$(basename dist/assets/index-*.css)
          page=$(curl -fsS -H 'Accept: text/html' https://hanzo.sh)
          grep -qF "$css" <<<"$page" ||
            { echo "::error::a browser at hanzo.sh is not getting this build's page"; exit 1; }
          echo "hanzo.sh serves ${GITHUB_SHA::7}"
