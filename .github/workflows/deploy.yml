name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # hanzo.sh is served by the assets Worker declared in wrangler.toml.
    # This repo lives in the hanzo-apps org, whose runners are their own scale
    # set. ARC matches runs-on against the scale-set name, so the hanzoai pool
    # cannot serve these jobs (see universe infra/k8s/arc).
    runs-on: hanzo-apps-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Assert the bundle carries the faces it names
        run: |
          css=$(ls dist/assets/*.css)
          grep -q '@font-face' "$css" || { echo "no @font-face in $css"; exit 1; }
          grep -q 'Geist' "$css" || { echo "no Geist in $css"; exit 1; }
          ls dist/assets/*.woff2 >/dev/null || { echo "no woff2 emitted"; exit 1; }
          grep -q '@import[^;]*http' "$css" && { echo "remote @import in $css"; exit 1; }
          echo "$css: $(grep -o '@font-face' "$css" | wc -l) @font-face rules, fonts bundled"

      - name: Deploy
        run: npx wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
