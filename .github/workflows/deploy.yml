name: deploy

# hanzo.sh is served by the Cloudflare Worker named `hanzo-sh` over its own
# static assets, and until this file existed it was published BY HAND (`pnpm
# build && npx wrangler@3 deploy`). That is why a correct fix could sit merged on
# main for weeks while `curl hanzo.sh | sh` kept handing out the old installer:
# the repo was right and the bytes users got were not. A host that only updates
# when someone remembers is a host that is stale by default.
#
# So: every push to main republishes, and the job REFUSES to pass unless the live
# URL actually serves the new bytes — in BOTH representations, because `/` is two
# resources: the installer to curl, the document to a browser.
#
# Runs on GitHub's runner: this org registers no self-hosted runner, and the only
# copy of the Cloudflare credential lives in GitHub org secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hanzo-sh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: record the bytes users get right now
        id: before
        run: |
          set -euo pipefail
          echo "md5=$(curl -sS https://hanzo.sh | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - run: pnpm build

      # Two files, each whole. The document must open with <!DOCTYPE html> at
      # byte 0 or the browser parses it in quirks mode and drops every <head>
      # element into <body>; the installer must parse under dash AND bash,
      # because the page publishes `| sh` and readers type `| bash` anyway — a
      # bash-only check is what let `set -o pipefail` ship in a file whose first
      # line says #!/bin/sh. dist/index.html must NOT exist: an asset at that
      # name is served before the Worker runs, and curl would get the document.
      - name: the page is a document and the installer is a script
        run: |
          set -euo pipefail
          [ "$(head -c 15 dist/page.html)" = '<!DOCTYPE html>' ]
          [ ! -e dist/index.html ]
          head -1 dist/install.sh | grep -qx '#!/bin/sh'
          dash -n dist/install.sh
          bash -n dist/install.sh
          cmp dist/install dist/install.sh
          ! grep -qiE 'astral\.sh|uv tool install' dist/install.sh

      - name: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy

      # `/` is now no-store, but the assets behind it are cached at the edge.
      # Best-effort: the token may not carry Cache Purge, and the check below is
      # what actually decides.
      - name: purge the edge
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 "https://api.cloudflare.com/client/v4/zones?name=hanzo.sh" \
                 | sed -n 's/.*"id":"\([0-9a-f]\{32\}\)".*/\1/p' | head -1)
          [ -n "$zone" ] || { echo "no zone id — leaving it to revalidation"; exit 0; }
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               -H "Content-Type: application/json" \
               --data '{"purge_everything":true}' \
               "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" | head -c 300

      # The only statement that matters: what does the live URL hand a stranger?
      # Twice — curl asks for anything, a browser asks for text/html.
      - name: the live bytes are the new bytes
        run: |
          set -euo pipefail
          want_sh=$(md5sum dist/install.sh | cut -d' ' -f1)
          want_html=$(md5sum dist/page.html | cut -d' ' -f1)
          # Content-hashed, so it changes whenever anything in the page does:
          # the marker that says the live document is THIS build and not a
          # cached older one.
          stamp=$(basename dist/assets/index-*.css)
          for i in $(seq 1 30); do
            got_sh=$(curl -sS https://hanzo.sh | md5sum | cut -d' ' -f1)
            got_html=$(curl -sS https://hanzo.sh/page.html | md5sum | cut -d' ' -f1)
            [ "$got_sh" = "$want_sh" ] && [ "$got_html" = "$want_html" ] && break
            sleep 10
          done
          echo "before        : ${{ steps.before.outputs.md5 }}"
          echo "installer     : built $want_sh   live $got_sh"
          echo "document      : built $want_html live $got_html"
          [ "$got_sh" = "$want_sh" ] || {
            echo "::error::curl hanzo.sh is not the installer that was just built"; exit 1; }
          [ "$got_html" = "$want_html" ] || {
            echo "::error::hanzo.sh/page.html is not the document that was just built"; exit 1; }

          # And what a browser is actually handed at `/` is that document. Not
          # compared byte-for-byte: Cloudflare can still append its Web
          # Analytics beacon to HTML a Worker returns, which the Worker asks it
          # not to do with no-transform but does not control.
          curl -sS -H 'Accept: text/html' https://hanzo.sh -o /tmp/live.html
          [ "$(head -c 15 /tmp/live.html)" = '<!DOCTYPE html>' ] || {
            echo "::error::a browser at hanzo.sh is not getting an HTML document"; exit 1; }
          grep -q "$stamp" /tmp/live.html || {
            echo "::error::a browser at hanzo.sh is getting a page older than $stamp"; exit 1; }

          # And it is still an installer, not just matching bytes.
          curl -sS https://hanzo.sh -o /tmp/live.sh
          dash -n /tmp/live.sh
          ! grep -qiE 'astral\.sh|uv tool install' /tmp/live.sh

          # Every path the page or the HTML head names. og:image used to point at
          # /og-image.svg, which was never in the repo — every social card was a
          # 404 and nothing said so.
          for p in /favicon.ico /favicon.svg /favicon-32x32.png /favicon-16x16.png \
                   /apple-touch-icon.png /og-image.png /fonts/Geist-Variable.woff2 \
                   /fonts/GeistMono-Variable.woff2 /install /install.sh /llms.txt \
                   /cli /mcp /dev /full /bot /desktop /node; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://hanzo.sh$p")
            [ "$code" = 200 ] || { echo "::error::hanzo.sh$p is $code"; exit 1; }
          done

          echo "hanzo.sh serves the build from ${GITHUB_SHA:0:8}"
